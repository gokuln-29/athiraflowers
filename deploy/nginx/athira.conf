# /etc/nginx/sites-available/athira.conf  (symlink into sites-enabled)
# Replace athiraflowers.ae with the real domain. Certificates are issued by certbot (see docs/DEPLOYMENT.md).

limit_req_zone $binary_remote_addr zone=athira_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=athira_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=athira_conn:10m;

upstream athira_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name athiraflowers.ae www.athiraflowers.ae;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://athiraflowers.ae$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.athiraflowers.ae;
  ssl_certificate     /etc/letsencrypt/live/athiraflowers.ae/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/athiraflowers.ae/privkey.pem;
  return 301 https://athiraflowers.ae$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name athiraflowers.ae;

  ssl_certificate     /etc/letsencrypt/live/athiraflowers.ae/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/athiraflowers.ae/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  server_tokens off;
  # Admin image uploads go straight to R2 (presigned). Everything else is small forms.
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  limit_conn athira_conn 40;

  # Never serve dotfiles or source maps.
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.map$ { deny all; }

  # Stripe signs the raw body: no buffering tricks, small limit. No limit_req here (set per location, not per server), so retries are never throttled.
  location = /api/stripe/webhook {
    client_max_body_size 1m;
    proxy_pass http://athira_app;
    include /etc/nginx/snippets/athira-proxy.conf;
  }

  # Brute-force protection in front of the app's own DB-backed limits.
  location = /admin/login {
    limit_req zone=athira_login burst=5 nodelay;
    proxy_pass http://athira_app;
    include /etc/nginx/snippets/athira-proxy.conf;
  }

  # Hashed build assets are immutable.
  location /_next/static/ {
    proxy_pass http://athira_app;
    include /etc/nginx/snippets/athira-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Internal health endpoint: reachable from the box only.
  location = /api/health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://athira_app;
    include /etc/nginx/snippets/athira-proxy.conf;
  }

  location / {
    limit_req zone=athira_general burst=40 nodelay;
    proxy_pass http://athira_app;
    include /etc/nginx/snippets/athira-proxy.conf;
  }

  access_log /var/log/nginx/athira.access.log;
  error_log  /var/log/nginx/athira.error.log warn;
}
